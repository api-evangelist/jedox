aid: jedox
name: Jedox
description: >-
  Jedox is an enterprise performance management (EPM) and financial planning &
  analysis (FP&A) software company headquartered in Freiburg, Germany. Its
  platform unifies planning, budgeting, AI-powered forecasting and scenario
  planning, financial consolidation, and management reporting on a
  multidimensional OLAP engine, connecting strategic, operational, and tactical
  plans to enable integrated business planning (IBP) across finance, sales, HR,
  and operations. Jedox offers an Excel-like web modeling experience,
  Microsoft 365 add-ins, Canvas dashboards, a data-integration layer
  (Integrator) with prebuilt connectors, AI agents (JedoxAI), and a mobile app,
  delivered as a governed cloud platform. It is backed by Insight Partners and
  is profiled here in the API Evangelist network as a company/provider.
